name: Akina SC64 Windows
on:
  workflow_dispatch:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: akina-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'elessdy/ares-akina-reach'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build N64 emulator and run transport tests
        shell: pwsh
        run: ./scripts/build-sc64.ps1 -BuildDirectory "$env:RUNNER_TEMP/ares-sc64-build" -Jobs 4
      - name: Test package isolation
        shell: pwsh
        run: ./tests/sc64/package.ps1 -WorkDirectory "$env:RUNNER_TEMP/sc64-package-tests"
      - name: Assemble unsigned portable emulator
        shell: pwsh
        run: ./scripts/Package-SC64.ps1 -RuntimeDirectory "$env:RUNNER_TEMP/ares-sc64-build/desktop-ui/rundir" -OutputDirectory "$env:RUNNER_TEMP/ares-akina-reach-windows-x64"
      - name: Upload portable emulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ares-akina-reach-windows-x64
          path: ${{ runner.temp }}/ares-akina-reach-windows-x64
          if-no-files-found: error
          retention-days: 14
